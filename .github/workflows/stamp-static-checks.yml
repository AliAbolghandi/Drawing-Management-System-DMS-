name: Stamp static validation

on:
  push:
    branches: [main]
    paths:
      - 'backend/server.js'
      - 'backend/stamp-routes.js'
      - 'frontend/index.html'
      - 'frontend/js/stamp.js'
      - 'frontend/lib/**'
      - 'SQL/Stamp-Workflow.sql'
      - 'AI_PROJECT_STATE.md'
      - '.github/workflows/stamp-static-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stamp-static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check backend/server.js
          node --check backend/stamp-routes.js
          node --check frontend/js/stamp.js
      - name: Verify local PDF assets and integration
        shell: bash
        run: |
          test -s frontend/lib/pdf-lib/pdf-lib.min.js
          test -s frontend/lib/pdfjs/pdf.min.mjs
          test -s frontend/lib/pdfjs/pdf.worker.min.mjs
          grep -q "registerStampRoutes(app" backend/server.js
          grep -q 'js/stamp.js' frontend/index.html
          grep -q "/item/\$\{item.StampItemID\}/complete" frontend/js/stamp.js
