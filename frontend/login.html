<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DMS | Login</title>
<link rel="stylesheet" href="css/style.css">
<style>
html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#071018;color:#e8f0f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.login-card{width:min(420px,calc(100% - 32px));padding:34px;border:1px solid #243746;border-radius:18px;background:#0c1821;box-shadow:0 20px 60px #0008}
.brand{font-size:25px;font-weight:700;margin-bottom:6px}.sub{color:#8fa5b5;margin-bottom:28px}
label{display:block;margin:16px 0 7px;color:#b8c8d4;font-size:14px}input{box-sizing:border-box;width:100%;padding:13px 14px;border:1px solid #304655;border-radius:9px;background:#08131b;color:#fff;font-size:15px;outline:none}input:focus{border-color:#55c8e8}
button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:#55c8e8;color:#041018;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
#error{display:none;margin-top:16px;padding:11px;border-radius:8px;background:#4b1f27;color:#ffb9c2;font-size:14px}
.meta{margin-top:22px;text-align:center;color:#657c8c;font-size:12px}
</style>
</head>
<body>
<main class="login-card">
<div class="brand">Drawing Management System</div>
<div class="sub">Secure sign in</div>
<form id="loginForm" autocomplete="on">
<label for="username">Username</label>
<input id="username" name="username" autocomplete="username" maxlength="100" required>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
<button id="submit" type="submit">Sign in</button>
<div id="error" role="alert"></div>
</form>
<div class="meta">Authorized users only</div>
</main>
<script>
(() => {
  const host = window.location.hostname || 'localhost';
  const API = `http://${host}:3000/api`;
  const form=document.getElementById('loginForm'), button=document.getElementById('submit'), error=document.getElementById('error');
  fetch(API+'/auth/me',{credentials:'include'}).then(r=>{if(r.ok) location.replace('index.html');}).catch(()=>{});
  form.addEventListener('submit',async e=>{
    e.preventDefault(); error.style.display='none'; button.disabled=true; button.textContent='Signing in...';
    try{
      const r=await fetch(API+'/auth/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});
      const data=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(data.error||'Login failed.');
      location.replace('index.html');
    }catch(err){error.textContent=err.message;error.style.display='block';button.disabled=false;button.textContent='Sign in';}
  });
})();
</script>
</body>
</html>
