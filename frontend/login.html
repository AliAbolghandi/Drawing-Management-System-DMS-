<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <script src="js/config.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>DMS | Login</title>
  <link rel="icon" href="assets/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/dms-icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/dms-icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <style>
    html,
    body {
      min-height: 100%;
      margin: 0
    }

    body {
      box-sizing: border-box;
      min-height: 100vh;
      padding: 24px 0;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 18px;
      background: linear-gradient(rgba(3, 10, 16, .48), rgb(0 0 0)), url("assets/images/Login%20Background.png") center/cover no-repeat fixed;
      color: #e8f0f7;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif
    }

    .srsc-logo {
      display: block;
      width: clamp(96px, 13vw, 136px);
      max-height: 19vh;
      object-fit: contain
    }

    .login-card {
      width: min(420px, calc(100% - 32px));
      padding: 34px;
      border: 1px solid var(--amber);
      border-radius: 18px;
      background: #000000;
      box-shadow: 0 20px 60px #0008
    }

    .brand {
      font-size: 25px;
      font-weight: 700;
      margin-bottom: 6px
    }

    .login-sub-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px
    }

    .sub {
      flex: 1;
      color: #8fa5b5;
      margin: 0;
      text-align: left
    }

    .login-sub-logo {
      display: block;
      flex: 0 0 auto;
      width: 145px;
      height: 145px;
      object-fit: fill;
      margin: auto;
    }

    @media (max-width: 420px) {
      .login-sub-logo {
        width: 48px;
        height: 48px
      }
    }

    label {
      display: block;
      margin: 16px 0 7px;
      color: #b8c8d4;
      font-size: 14px
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #304655;
      border-radius: 9px;
      background: #08131b;
      color: #fff;
      font-size: 15px;
      outline: none
    }

    input:focus {
      border-color: #55c8e8
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: var(--amber);
      color: #041018;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer
    }

    button:hover{
      background: #f3b65c;
    }

    button:disabled {
      opacity: .55;
      cursor: wait
    }

    #error {
      display: none;
      margin-top: 16px;
      padding: 11px;
      border-radius: 8px;
      background: #4b1f27;
      color: #ffb9c2;
      font-size: 14px
    }

    .meta {
      margin-top: 22px;
      text-align: center;
      color: #657c8c;
      font-size: 12px
    }
  
    /* Decorative live gear: the blueprint image itself stays static. */
    .login-gear {
      position: fixed;
      z-index: 0;
      top: clamp(118px, 21.5vh, 230px);
      right: clamp(18px, 2.2vw, 40px);
      width: clamp(88px, 11vw, 178px);
      height: auto;
      pointer-events: none;
      transform-origin: 50% 50%;
      animation: dmsGearSpin 38s linear infinite, dmsGearGlow 5s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 8px rgba(38, 151, 255, .38));
    }

    @keyframes dmsGearSpin {
      to { transform: rotate(360deg); }
    }

    @keyframes dmsGearGlow {
      from { filter: drop-shadow(0 0 5px rgba(38, 151, 255, .24)); }
      to { filter: drop-shadow(0 0 15px rgba(38, 151, 255, .72)); }
    }

    .login-card {
      position: relative;
      z-index: 1;
    }

    @media (max-width: 640px) {
      .login-gear {
        top: 13vh;
        right: 5vw;
        width: clamp(68px, 17vw, 104px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .login-gear {
        animation: none;
        filter: drop-shadow(0 0 7px rgba(38, 151, 255, .42));
      }
    }

  </style>
</head>

<body>

    <circle cx="100" cy="100" r="61" fill="none" stroke="#347fb9" stroke-width="3" opacity=".85"/>
    <path d="M 54 116 A 51 51 0 0 1 139 60" fill="none" stroke="url(#dmsGearBlue)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 146 79 A 51 51 0 0 1 82 151" fill="none" stroke="#1b8de9" stroke-width="4" stroke-linecap="round" opacity=".8"/>

    <circle cx="100" cy="100" r="7" fill="#62c8ff"/>
  </svg>
  <main class="login-card">
    <img class="login-sub-logo" src="assets/images/SRSC-Logo.png" alt="SRSC logo">
    <div class="brand">Drawing Management System</div>
    <div class="login-sub-row">
      <div class="sub">Please sign in</div>

    </div>
    <form id="loginForm" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" maxlength="100" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
      <button id="submit" type="submit">Sign in</button>
      <div id="error" role="alert"></div>
    </form>
    <!-- <div class="meta">Authorized users only</div> -->
  </main>
  <script>
    (() => {
      const API = `${window.DMS_API_BASE || ''}/api`;
      const form = document.getElementById('loginForm'), button = document.getElementById('submit'), error = document.getElementById('error');
      fetch(API + '/auth/me', { credentials: 'include' }).then(r => { if (r.ok) location.replace('index.html'); }).catch(() => { });
      form.addEventListener('submit', async e => {
        e.preventDefault(); error.style.display = 'none'; button.disabled = true; button.textContent = 'Signing in...';
        try {
          const r = await fetch(API + '/auth/login', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('username').value.trim(), password: document.getElementById('password').value }) });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(data.error || 'Login failed.');
          location.replace('index.html');
        } catch (err) { error.textContent = err.message; error.style.display = 'block'; button.disabled = false; button.textContent = 'Sign in'; }
      });
    })();
  </script>
</body>

</html>
